apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

android {
    compileSdkVersion project.properties.compileSdkVersion.toInteger() ?: 31
    ndkVersion "25.1.8937393"
    defaultConfig {
        applicationId 'vn.vhn.pckeyboard'
        buildConfigField "Boolean", "GOOGLEPLAY_BUILD", project.properties.googlePlayBuild ?: "false"
        minSdkVersion 24
        targetSdkVersion project.properties.targetSdkVersion.toInteger() ?: 31
        versionCode 1
        versionName "v1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        externalNativeBuild {
            cmake {
                cppFlags ""
            }
        }
        // AYN Thor is arm64 (kalama / SD8 Gen2); build only that ABI for fast cycles.
        ndk {
            abiFilters 'arm64-v8a'
        }
    }
    // The kbdinject binary ships as libkbdinject.so and must be extracted to disk
    // (nativeLibraryDir) so it can be exec'd as a root daemon.
    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    lint {
        checkReleaseBuilds false
    }
    // AGP 8 turns these off by default; this project uses BuildConfig (LatinIME) and
    // an AIDL interface (ITaskStackListener), so re-enable them explicitly.
    buildFeatures {
        buildConfig true
        aidl true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    externalNativeBuild {
        cmake {
            path "CMakeLists.txt"
        }
    }
    namespace 'vn.vhn.pckeyboard'
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    compileOnly fileTree(include: ['*.jar'], dir: 'frameworks')
    implementation 'com.github.tiann:FreeReflection:3.1.0'
    implementation 'androidx.appcompat:appcompat:1.1.0'
    implementation 'androidx.core:core-ktx:1.2.0'
    implementation 'androidx.constraintlayout:constraintlayout:1.1.3'
    implementation "androidx.window:window:1.0.0-alpha09"
    implementation "com.microsoft.device.display:display-mask:0.3.0"
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.0.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.0.0'
    implementation 'me.jfenn:crasher:0.0.2'

    testImplementation 'junit:junit:4.12'
    androidTestImplementation 'androidx.test:runner:1.5.2'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}