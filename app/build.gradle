// AGP 9 has built-in Kotlin support; the separate 'kotlin-android' plugin is gone.
apply plugin: 'com.android.application'

android {
    compileSdk = (findProperty('compileSdkVersion') ?: 31) as int
    // Pinned: AGP 9.4 would otherwise default to build-tools 36.0.0 and try to
    // auto-install it. 36.1.0 is what this machine has.
    buildToolsVersion = "36.1.0"
    ndkVersion = "25.1.8937393"
    defaultConfig {
        applicationId = 'vn.vhn.pckeyboard'
        buildConfigField "Boolean", "GOOGLEPLAY_BUILD", (findProperty('googlePlayBuild') ?: "false").toString()
        minSdk = 24
        targetSdk = (findProperty('targetSdkVersion') ?: 31) as int
        versionCode = 1
        versionName = "v1.0"
        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
        // Every target device is arm64; building one ABI keeps cycles fast.
        ndk {
            abiFilters 'arm64-v8a'
        }
        externalNativeBuild {
            cmake {
                cppFlags ""   // list-append, not an assignment
                // Vietnamese input (libunikey) is in every flavor; the uinput
                // injector daemon is Thor-only and opted into below.
                arguments "-DBUILD_KBDINJECT=OFF"
            }
        }
    }

    // One APK per device: device-specific code, permissions and native binaries are
    // selected at compile time rather than guarded at runtime. Shared code talks to
    // `vn.vhn.pckeyboard.device.DeviceIntegration`, which each flavor implements.
    flavorDimensions += 'device'
    productFlavors {
        // Phones, foldables, tablets. No root, no second screen, no extra permissions.
        generic {
            dimension = 'device'
            isDefault = true
        }
        // AYN Thor dual-screen handheld: rooted, uinput injection, second-screen deck.
        thor {
            dimension = 'device'
            externalNativeBuild {
                cmake {
                    arguments "-DBUILD_KBDINJECT=ON"
                }
            }
        }
    }
    // The Thor kbdinject binary ships as libkbdinject.so and must be extracted to disk
    // (nativeLibraryDir) so it can be exec'd as a root daemon.
    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }
    buildTypes {
        release {
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    lint {
        checkReleaseBuilds = false
    }
    // AGP 8 turns these off by default; this project uses BuildConfig (LatinIME) and,
    // in the thor flavor, an AIDL interface (ITaskStackListener).
    buildFeatures {
        buildConfig = true
        aidl = true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlin {
        compilerOptions {
            jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
        }
    }
    externalNativeBuild {
        cmake {
            path = "CMakeLists.txt"
        }
    }
    namespace = 'vn.vhn.pckeyboard'
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    compileOnly fileTree(include: ['*.jar'], dir: 'frameworks')
    implementation 'com.github.tiann:FreeReflection:3.1.0'
    implementation 'androidx.appcompat:appcompat:1.1.0'
    implementation 'androidx.core:core-ktx:1.2.0'
    implementation 'androidx.constraintlayout:constraintlayout:1.1.3'
    implementation "androidx.window:window:1.0.0-alpha09"
    implementation "com.microsoft.device.display:display-mask:0.3.0"
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.0.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.0.0'

    testImplementation 'junit:junit:4.12'
    androidTestImplementation 'androidx.test:runner:1.5.2'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}