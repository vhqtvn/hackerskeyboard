<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="58" y1="40" x2="454" y2="472" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2A2620"/>
      <stop offset="0.5" stop-color="#141210"/>
      <stop offset="1" stop-color="#070607"/>
    </linearGradient>
    <radialGradient id="glow" cx="30%" cy="16%" r="80%">
      <stop offset="0" stop-color="#FFD57A" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#FFD57A" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#FFD57A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="256" y1="150" x2="256" y2="292" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFF3C8"/>
      <stop offset="0.48" stop-color="#F3CB63"/>
      <stop offset="1" stop-color="#C08A1E"/>
    </linearGradient>
    <linearGradient id="goldbar" x1="256" y1="398" x2="256" y2="422" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFE9A8"/>
      <stop offset="1" stop-color="#D19A2A"/>
    </linearGradient>
    <linearGradient id="screenFill" x1="256" y1="82" x2="256" y2="328" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFD57A" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#FFD57A" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="kbdFill" x1="256" y1="350" x2="256" y2="434" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1A1712"/>
      <stop offset="1" stop-color="#0B0A08"/>
    </linearGradient>
    <clipPath id="clip"><rect width="512" height="512" rx="112"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="512" height="512" fill="url(#bg)"/>
    <rect width="512" height="512" fill="url(#glow)"/>
    <circle cx="450" cy="450" r="180" fill="#000000" opacity="0.28"/>

    <!-- dual-screen frame -->
    <rect x="78" y="78" width="356" height="248" rx="42" fill="url(#screenFill)"
          stroke="#E9C46A" stroke-width="7" stroke-opacity="0.55"/>
    <path d="M256 100V304" stroke="#E9C46A" stroke-width="5" stroke-linecap="round" stroke-opacity="0.18"/>
    <path d="M109 108H226" stroke="#E9C46A" stroke-width="4" stroke-linecap="round" stroke-opacity="0.14"/>
    <path d="M286 108H403" stroke="#E9C46A" stroke-width="4" stroke-linecap="round" stroke-opacity="0.14"/>

    <!-- VH shadow -->
    <g fill="none" stroke="#000000" stroke-width="23" stroke-linecap="round" stroke-linejoin="round" opacity="0.35" transform="translate(0 9)">
      <path d="M122 154 L187 282 L248 154"/><path d="M286 282 L320 154"/><path d="M358 282 L392 154"/><path d="M303 221 H374"/>
    </g>
    <!-- VH gold -->
    <g fill="none" stroke="url(#gold)" stroke-width="20" stroke-linecap="round" stroke-linejoin="round">
      <path d="M122 154 L187 282 L248 154"/><path d="M286 282 L320 154"/><path d="M358 282 L392 154"/><path d="M303 221 H374"/>
    </g>

    <!-- keyboard -->
    <rect x="116" y="362" width="280" height="88" rx="28" fill="#000000" opacity="0.35"/>
    <rect x="116" y="354" width="280" height="88" rx="28" fill="url(#kbdFill)" stroke="#E9C46A" stroke-width="5" stroke-opacity="0.5"/>
    <g fill="#EBD9A6">
      <rect x="146" y="378" width="38" height="24" rx="7"/><rect x="195" y="378" width="38" height="24" rx="7"/>
      <rect x="244" y="378" width="38" height="24" rx="7"/><rect x="293" y="378" width="58" height="24" rx="7"/>
    </g>
    <rect x="178" y="412" width="156" height="20" rx="9" fill="url(#goldbar)"/>
  </g>
</svg>
